services:
  postgres:
    image: postgres:16-alpine
    container_name: bodega360-postgres
    environment:
      POSTGRES_DB: bodega360
      POSTGRES_USER: bodega360
      POSTGRES_PASSWORD: bodega360
    ports:
      - "5432:5432"
    volumes:
      - bodega360_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodega360 -d bodega360"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bodega360_postgres:
