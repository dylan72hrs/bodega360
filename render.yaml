services:
  - type: web
    name: bodega360-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run prisma:generate && npm run build:api && npm run prisma:migrate:deploy
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bodega360-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: bodega360-web
    runtime: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: bodega360-postgres
    plan: starter
